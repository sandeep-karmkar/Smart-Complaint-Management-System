<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Complaint Management System</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,
    #071739,
    #0b2c6a,
    #2563eb);

    overflow:hidden;

    position:relative;
}

/* ================= BACKGROUND CIRCLES ================= */

.circle1{

    position:absolute;

    width:300px;

    height:300px;

    background:rgba(255,255,255,0.08);

    border-radius:50%;

    top:-80px;

    left:-80px;
}

.circle2{

    position:absolute;

    width:350px;

    height:350px;

    background:rgba(255,255,255,0.06);

    border-radius:50%;

    bottom:-120px;

    right:-120px;
}

/* ================= AUTH CARD ================= */

.auth-card{

    width:100%;

    max-width:430px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:30px;

    padding:40px;

    color:white;

    box-shadow:0 8px 30px rgba(0,0,0,0.2);

    position:relative;

    z-index:10;
}

/* ================= LOGO ================= */

.logo{

    text-align:center;

    margin-bottom:30px;
}

.logo i{

    font-size:55px;

    margin-bottom:15px;

    color:#ffffff;
}

.logo h1{

    font-size:40px;

    font-weight:700;
}

/* ================= INPUTS ================= */

.custom-input{

    height:55px;

    border-radius:15px;

    border:none;

    background:rgba(255,255,255,0.15);

    color:white;

    padding-left:15px;
}

.custom-input::placeholder{
    color:#e5e7eb;
}

.custom-input:focus{

    background:rgba(255,255,255,0.2);

    color:white;

    box-shadow:none;

    border:1px solid rgba(255,255,255,0.3);
}

/* ================= BUTTON ================= */

.auth-btn{

    width:100%;

    height:55px;

    border:none;

    border-radius:15px;

    background:white;

    color:#071739;

    font-weight:700;

    font-size:18px;

    transition:0.3s;
}

.auth-btn:hover{

    transform:translateY(-3px);

    background:#f3f4f6;
}

/* ================= TEXT ================= */

.auth-link{

    color:#ffffff;

    text-decoration:none;

    font-weight:600;
}

.auth-link:hover{
    color:#dbeafe;
}

.text-light-custom{
    color:#e5e7eb;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

.auth-card{

    margin:20px;

    padding:30px 25px;
}

.logo h1{
    font-size:32px;
}

}

</style>

</head>

<body>

<div class="circle1"></div>

<div class="circle2"></div>

{% block content %}
{% endblock %}

</body>

</html>
