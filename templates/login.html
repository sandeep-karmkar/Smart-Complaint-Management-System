{% extends 'auth_base.html' %}

{% block content %}

<div class="auth-card">

    <!-- ================= LOGO ================= -->

    <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

        <h1>ServiQ</h1>

        <p class="text-light-custom">

            Complaint Management System

        </p>

    </div>

    <!-- ================= HEADING ================= -->

    <div class="text-center mb-4">

        <h2 class="fw-bold">

            Welcome Back 👋

        </h2>

        <p class="text-light-custom">

            Login to continue your dashboard

        </p>

    </div>

    <!-- ================= FORM ================= -->

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="mb-2 fw-semibold">

                Username

            </label>

            <input type="text"
                   name="username"
                   class="form-control custom-input"
                   placeholder="Enter Username"
                   required>

        </div>

        <div class="mb-4">

            <label class="mb-2 fw-semibold">

                Password

            </label>

            <input type="password"
                   name="password"
                   class="form-control custom-input"
                   placeholder="Enter Password"
                   required>

        </div>

        <button type="submit"
                class="auth-btn">

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>

    <!-- ================= ERROR ================= -->

    {% if error %}

    <div class="alert alert-danger mt-4 text-center">

        {{ error }}

    </div>

    {% endif %}

    <!-- ================= FOOTER ================= -->

    <div class="text-center mt-4">

        <p class="mb-0 text-light-custom">

            Don't have an account?

            <a href="/register/"
               class="auth-link">

                Register

            </a>

        </p>

    </div>

</div>

{% endblock %}
